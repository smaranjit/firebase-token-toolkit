version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # egui, eframe and egui_extras must move together — they share a version.
      egui:
        patterns: ["egui*", "eframe"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
