version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # egui, eframe and egui_extras must move together — they share a version.
      egui:
        patterns: ["egui*", "eframe"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The msrv job pins this tag to the declared rust-version on purpose; it is
      # not a dependency to keep current. Bumping it would quietly turn the MSRV
      # check into a latest-stable check that always passes. Raise the MSRV in
      # Cargo.toml and this pin together, deliberately.
      - dependency-name: "dtolnay/rust-toolchain"
