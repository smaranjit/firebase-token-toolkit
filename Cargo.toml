[package]
name = "firebase-token-toolkit"
version = "0.1.0"
edition = "2021"
# Determined empirically from the resolved dependency tree, not from eframe's own
# declared 1.76 — transitive deps (home, image, time) have since moved past it.
# CI enforces this exact version; see the msrv job in .github/workflows/ci.yml.
rust-version = "1.88"
authors = ["Smaranjit Maiti"]
description = "A native desktop GUI for minting and exchanging Firebase auth tokens — custom tokens, ID tokens, custom claims, and App Check debug tokens."
license = "MIT"
readme = "README.md"
repository = "https://github.com/smaranjit/firebase-token-toolkit"
homepage = "https://github.com/smaranjit/firebase-token-toolkit"
keywords = ["firebase", "auth", "jwt", "gui", "egui"]
categories = ["development-tools", "gui", "authentication"]
# NOT excluding /assets: main.rs include_bytes!s icon-256.png and build.rs reads
# icon.ico, so dropping it here would break a packaged build.
exclude = ["/dist", "/.github"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The rust_crypto feature is required, not optional: jsonwebtoken 11's default
# feature set selects no crypto provider, and without one `encode` panics at
# runtime ("Could not automatically determine the process-level CryptoProvider").
# Key parsing still succeeds, so the failure only shows up when actually signing.
# rust_crypto is pure Rust; aws_lc_rs is the alternative but needs cmake/nasm,
# which would complicate the Windows build and the cargo-xwin cross-build.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
base64 = "0.23"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.15"
anyhow = "1"
arboard = "3"

# Unconditional, not [target.'cfg(windows)'.build-dependencies]: cargo resolves
# cfg() on build-dependencies against the HOST, so a Linux -> Windows cross-build
# would silently drop it. build.rs gates on CARGO_CFG_TARGET_OS instead.
[dev-dependencies]
# Used only to generate a throwaway RSA key inside the signing test, so no
# private key needs to be committed to the repository.
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"

[build-dependencies]
winresource = "0.1"

# RSA key generation is bignum-heavy and takes seconds when built unoptimized,
# which would make `cargo test` needlessly slow and its runtime variable.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
