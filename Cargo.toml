[package]
name = "firebase-token-toolkit"
version = "0.1.4"
edition = "2021"
# Determined empirically from the resolved dependency tree, not from any single
# crate's declared minimum. eframe 0.33 itself claims 1.88, but ordered-float
# (pulled in transitively) requires 1.90, and the tree's floor is what actually
# governs.
# CI enforces this exact version; see the msrv job in .github/workflows/ci.yml.
rust-version = "1.90"
authors = ["Smaranjit Maiti"]
description = "A native desktop GUI for minting and exchanging Firebase auth tokens — custom tokens, ID tokens, custom claims, and App Check debug tokens."
license = "MIT"
readme = "README.md"
repository = "https://github.com/smaranjit/firebase-token-toolkit"
homepage = "https://github.com/smaranjit/firebase-token-toolkit"
keywords = ["firebase", "auth", "jwt", "gui", "egui"]
categories = ["development-tools", "gui", "authentication"]
# NOT excluding /assets: main.rs include_bytes!s icon-256.png and build.rs reads
# icon.ico, so dropping it here would break a packaged build.
exclude = ["/dist", "/.github"]

[dependencies]
# Both renderers are compiled in. glow (OpenGL) is tried first and wgpu is the
# fallback: OpenGL is unavailable in many VMs and RDP sessions, where Windows
# offers only a 1.1 software implementation, while wgpu can use D3D12 there.
#
# x11 and wayland are listed explicitly because default-features = false no
# longer pulls the winit platform backends in; without them the build fails with
# "The platform you're compiling for is not supported by winit".
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wgpu", "persistence", "x11", "wayland"] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["all_loaders"] }
# Declared directly, and only, to switch its default features back on. eframe
# depends on egui-wgpu with default-features = false and re-enables them through
# its own `default` feature — which our `default-features = false` strips. The
# casualty is `wgpu/default`, the feature that compiles in the platform backends,
# so without this wgpu panics at startup with "No wgpu backend feature that is
# implemented for the target platform was enabled". Keep the version in lockstep
# with eframe.
egui-wgpu = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The rust_crypto feature is required, not optional: jsonwebtoken 11's default
# feature set selects no crypto provider, and without one `encode` panics at
# runtime ("Could not automatically determine the process-level CryptoProvider").
# Key parsing still succeeds, so the failure only shows up when actually signing.
# rust_crypto is pure Rust; aws_lc_rs is the alternative but needs cmake/nasm,
# which would complicate the Windows build and the cargo-xwin cross-build.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
base64 = "0.23"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.15"
anyhow = "1"
arboard = "3"

# Unconditional, not [target.'cfg(windows)'.build-dependencies]: cargo resolves
# cfg() on build-dependencies against the HOST, so a Linux -> Windows cross-build
# would silently drop it. build.rs gates on CARGO_CFG_TARGET_OS instead.
[dev-dependencies]
# Used only to generate a throwaway RSA key inside the signing test, so no
# private key needs to be committed to the repository.
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"

[build-dependencies]
winresource = "0.1"

# RSA key generation is bignum-heavy and takes seconds when built unoptimized,
# which would make `cargo test` needlessly slow and its runtime variable.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
